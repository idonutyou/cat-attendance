name: Build CAT Android Widget APK

on:
  push:
    branches:
      - main
    paths:
      - 'android-widget/**'
      - '.github/workflows/android-widget.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-widget-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build widget APK
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          APP_URL="https://${OWNER}.github.io/${REPO}/"
          echo "CAT_APP_URL=${APP_URL}"
          gradle -p android-widget :app:assembleDebug -PCAT_APP_URL="${APP_URL}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CAT-widget-debug-apk
          path: android-widget/app/build/outputs/apk/debug/app-debug.apk
