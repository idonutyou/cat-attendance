name: Build CAT Android Widget APK

on:
  push:
    branches:
      - main
    paths:
      - 'android-widget/**'
      - '.github/workflows/android-widget.yml'
      - 'scripts/setup-widget-signing.ps1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-widget-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android API 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Check signing secrets
        shell: bash
        env:
          CAT_WIDGET_KEYSTORE_BASE64: ${{ secrets.CAT_WIDGET_KEYSTORE_BASE64 }}
          CAT_WIDGET_KEYSTORE_PASSWORD: ${{ secrets.CAT_WIDGET_KEYSTORE_PASSWORD }}
        run: |
          test -n "${CAT_WIDGET_KEYSTORE_BASE64}" || { echo "::error::Missing CAT_WIDGET_KEYSTORE_BASE64"; exit 1; }
          test -n "${CAT_WIDGET_KEYSTORE_PASSWORD}" || { echo "::error::Missing CAT_WIDGET_KEYSTORE_PASSWORD"; exit 1; }

      - name: Restore fixed signing keystore
        shell: bash
        env:
          CAT_WIDGET_KEYSTORE_BASE64: ${{ secrets.CAT_WIDGET_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="${RUNNER_TEMP}/cat-widget-release.jks"
          printf '%s' "${CAT_WIDGET_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
          chmod 600 "${KEYSTORE_PATH}"
          echo "CAT_WIDGET_KEYSTORE_PATH=${KEYSTORE_PATH}" >> "${GITHUB_ENV}"

      - name: Build signed widget APK
        shell: bash
        env:
          CAT_WIDGET_KEYSTORE_PASSWORD: ${{ secrets.CAT_WIDGET_KEYSTORE_PASSWORD }}
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          APP_URL="https://${OWNER}.github.io/${REPO}/"
          echo "CAT_WIDGET_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "${GITHUB_ENV}"
          echo "CAT_WIDGET_VERSION_NAME=1.29.${GITHUB_RUN_NUMBER}" >> "${GITHUB_ENV}"
          export CAT_WIDGET_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          export CAT_WIDGET_VERSION_NAME="1.29.${GITHUB_RUN_NUMBER}"
          gradle -p android-widget :app:assembleRelease -PCAT_APP_URL="${APP_URL}"

      - name: Verify APK signature
        shell: bash
        run: |
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            android-widget/app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CAT-widget-signed-apk
          path: android-widget/app/build/outputs/apk/release/app-release.apk

      - name: Publish fixed latest download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-widget/app/build/outputs/apk/release/app-release.apk CAT-widget.apk
          if gh release view widget-latest >/dev/null 2>&1; then
            gh release upload widget-latest CAT-widget.apk --clobber
          else
            gh release create widget-latest CAT-widget.apk \
              --title "CAT Widget Latest" \
              --notes "CAT 위젯 최신 설치 파일"
          fi
