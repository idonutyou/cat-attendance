name: Build CAT Android Widget APK

on:
  push:
    branches:
      - main
    paths:
      - 'android-widget/**'
      - '.github/workflows/android-widget.yml'
      - 'scripts/setup-widget-signing.ps1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-widget-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Check signing secrets
        shell: bash
        env:
          CAT_WIDGET_KEYSTORE_BASE64: ${{ secrets.CAT_WIDGET_KEYSTORE_BASE64 }}
          CAT_WIDGET_KEYSTORE_PASSWORD: ${{ secrets.CAT_WIDGET_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "${CAT_WIDGET_KEYSTORE_BASE64}" ]; then
            echo "::error::Missing repository secret CAT_WIDGET_KEYSTORE_BASE64"
            exit 1
          fi
          if [ -z "${CAT_WIDGET_KEYSTORE_PASSWORD}" ]; then
            echo "::error::Missing repository secret CAT_WIDGET_KEYSTORE_PASSWORD"
            exit 1
          fi

      - name: Restore fixed signing keystore
        shell: bash
        env:
          CAT_WIDGET_KEYSTORE_BASE64: ${{ secrets.CAT_WIDGET_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="${RUNNER_TEMP}/cat-widget-release.jks"
          printf '%s' "${CAT_WIDGET_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
          chmod 600 "${KEYSTORE_PATH}"
          echo "CAT_WIDGET_KEYSTORE_PATH=${KEYSTORE_PATH}" >> "${GITHUB_ENV}"

      - name: Build signed widget APK
        shell: bash
        env:
          CAT_WIDGET_KEYSTORE_PASSWORD: ${{ secrets.CAT_WIDGET_KEYSTORE_PASSWORD }}
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          APP_URL="https://${OWNER}.github.io/${REPO}/"
          AUTO_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          AUTO_VERSION_NAME="1.29.${GITHUB_RUN_NUMBER}"
          echo "CAT_APP_URL=${APP_URL}"
          echo "Widget versionCode=${AUTO_VERSION_CODE}"
          echo "Widget versionName=${AUTO_VERSION_NAME}"
          sed -i -E "s/versionCode [0-9]+/versionCode ${AUTO_VERSION_CODE}/" android-widget/app/build.gradle
          sed -i -E "s/versionName '[^']+'/versionName '${AUTO_VERSION_NAME}'/" android-widget/app/build.gradle
          gradle -p android-widget :app:assembleRelease -PCAT_APP_URL="${APP_URL}"

      - name: Verify APK signature
        shell: bash
        run: |
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            android-widget/app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: CAT-widget-v122-signed-apk
          path: android-widget/app/build/outputs/apk/release/app-release.apk
      - name: Publish latest widget APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          cp android-widget/app/build/outputs/apk/release/app-release.apk release/CAT-widget.apk

          if gh release view widget-latest >/dev/null 2>&1; then
            gh release upload widget-latest release/CAT-widget.apk --clobber
          else
            gh release create widget-latest release/CAT-widget.apk \
              --title "CAT Widget Latest" \
              --notes "CAT 위젯 최신 설치 파일입니다. WIDGET 버튼에서 이 파일을 사용합니다."
          fi

