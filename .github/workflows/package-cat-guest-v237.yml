name: Build and package CAT Guest sync v237
on:
  push:
    branches:
      - backup/cat-guest-sync-fix-20261106-p50
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and build actual CAT web app
        run: |
          npm ci
          npm run build
      - name: Check Guest sync safety invariants
        run: |
          node --check src/main.js
          node --input-type=module -e '
          import fs from "node:fs";
          import assert from "node:assert/strict";
          const s=fs.readFileSync("src/main.js","utf8");
          const save=s.split("function saveRecords() {")[1]?.split("function loadWeeklyDateRange()")[0];
          assert.ok(save?.includes("persistGuestSnapshotIfNeeded()"));
          assert.ok(!save?.includes("sendCurrentStateBackToNativeWidget("));
          assert.ok(s.includes("GUEST_CLOUD_DIRTY_KEY"));
          assert.ok(s.includes("applyGuestWidgetCloudSnapshot("));
          assert.ok(s.includes("guestLocalRevision !== startingRevision"));
          assert.ok(s.includes("guestCloudWriteInFlight"));
          assert.ok(s.includes("equivalentSyncedStorageValue"));
          assert.ok(fs.existsSync("dist/index.html"));
          '
      - name: Package modified file without scripts
        run: |
          mkdir -p package/src
          cp src/main.js package/src/main.js
          (cd package && zip -q -r ../CAT_Guest_Sync_v237_patch_files.zip src)
          unzip -t CAT_Guest_Sync_v237_patch_files.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CAT_Guest_Sync_v237_patch_files
          path: CAT_Guest_Sync_v237_patch_files.zip
          if-no-files-found: error
