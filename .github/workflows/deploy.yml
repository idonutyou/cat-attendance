name: Deploy Vite to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build CAT Android Widget APK
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Add latest CAT widget APK to Pages
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output dist/CAT-widget.apk \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/widget-latest/CAT-widget.apk"
          test -s dist/CAT-widget.apk
          echo "CAT widget APK added to GitHub Pages: $(wc -c < dist/CAT-widget.apk) bytes"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    if: ${{ always() && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    needs:
      - build
      - deploy

    steps:
      - name: Send web deploy phone notification
        shell: bash
        env:
          CAT_NTFY_TOPIC: ${{ secrets.CAT_NTFY_TOPIC }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          if [ -z "${CAT_NTFY_TOPIC}" ]; then
            echo "CAT_NTFY_TOPIC is not configured; skipping phone notification."
            exit 0
          fi

          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if [ "${BUILD_RESULT}" = "success" ] && [ "${DEPLOY_RESULT}" = "success" ]; then
            TITLE="CAT 웹앱 배포 완료"
            MESSAGE="CAT 웹앱 GitHub Pages 업데이트가 완료됐습니다."
            TAGS="white_check_mark,computer"
            PRIORITY="default"
          else
            TITLE="CAT 웹앱 배포 실패"
            MESSAGE="CAT 웹앱 업데이트가 실패했습니다. GitHub Actions 로그를 확인해 주세요."
            TAGS="x,warning,computer"
            PRIORITY="high"
          fi

          curl --fail --silent --show-error \
            -H "Title: ${TITLE}" \
            -H "Priority: ${PRIORITY}" \
            -H "Tags: ${TAGS}" \
            -H "Click: ${RUN_URL}" \
            -d "${MESSAGE}" \
            "https://ntfy.sh/${CAT_NTFY_TOPIC}"

