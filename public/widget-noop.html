<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>CAT 근태관리 위젯 연결</title>
    <script>
      // In the hidden widget-transport iframe this page must remain inert.
      // Some Android browsers open the intent fallback as a top-level page.
      // Recover to the actual CAT app instead of displaying a blank page.
      if (window.self === window.top) {
        window.location.replace(new URL('./', window.location.href).href);
      }
    </script>
  </head>
  <body>
    <noscript><a href="./">CAT 근태관리로 돌아가기</a></noscript>
  </body>
</html>
