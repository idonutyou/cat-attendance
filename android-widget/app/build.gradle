plugins {
    id 'com.android.application'
}

def rawCatAppUrl = (project.findProperty("CAT_APP_URL")
        ?: "https://YOUR_GITHUB_USERNAME.github.io/cat-attendance/").toString()
def escapedCatAppUrl = rawCatAppUrl
        .replace('\\', '\\\\')
        .replace('"', '\\"')

def widgetKeystorePath = System.getenv("CAT_WIDGET_KEYSTORE_PATH")
def widgetKeystorePassword = System.getenv("CAT_WIDGET_KEYSTORE_PASSWORD")

android {
    namespace 'com.cat.attendance.widget'
    compileSdk 36

    defaultConfig {
        applicationId 'com.cat.attendance.widget'
        minSdk 26
        targetSdk 36
        versionCode 20
        versionName '1.19.0'
        buildConfigField 'String', 'CAT_APP_URL', '"' + escapedCatAppUrl + '"'
    }


    signingConfigs {
        catRelease {
            if (widgetKeystorePath && widgetKeystorePassword) {
                storeFile file(widgetKeystorePath)
                storePassword widgetKeystorePassword
                keyAlias 'cat-widget'
                keyPassword widgetKeystorePassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.catRelease
        }
    }
    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
